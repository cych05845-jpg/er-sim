<style>
[hidden]{display:none!important}
/* Layout: phone-first single column; sticky app bar, zone colour as the big block, bottom tab bar inside a zone; TTAS level colours carry all meaning */
:root{
  --bg:#EEF2F4; --surface:#FFFFFF; --surface-2:#E6ECEF; --line:#D1DAE0;
  --ink:#16252F; --ink-2:#526570; --brand:#14506B; --brand-ink:#FFFFFF;
  --lv1:#B42318; --lv2:#D9531E; --lv3:#B7790A; --lv4:#2F855A; --lv5:#2B6CB0;
  --z-triage:#14506B; --z-leader:#5B3A8C; --z-peds:#A23D6E; --z-resus:#9E2A1E; --z-treat:#1F6F5C; --z-obs:#7A5A12; --z-spec:#4F6420;
  --ok:#2F855A; --bad:#B42318; --tint:#FFF7E6; --tint-line:#E9C77A; --focus:#2B6CB0;
  --u1:#14506B; --uc:#14506B;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E181E; --surface:#16242C; --surface-2:#1E303A; --line:#2C4250;
  --ink:#E4EDF1; --ink-2:#9AB0BB; --brand:#5FA8C9; --brand-ink:#0E181E;
  --lv1:#E5544A; --lv2:#E8793E; --lv3:#C99A2E; --lv4:#3F9E6E; --lv5:#4F8FD6;
  --z-triage:#1C6687; --z-leader:#6E4CA6; --z-peds:#B5507F; --z-resus:#B23A2C; --z-treat:#2A8570; --z-obs:#957224; --z-spec:#67822B;
  --ok:#58B884; --bad:#F0645A; --tint:#2A2414; --tint-line:#7A6430; --focus:#6AA6E8; --uc:#1C6687; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E181E; --surface:#16242C; --surface-2:#1E303A; --line:#2C4250;
  --ink:#E4EDF1; --ink-2:#9AB0BB; --brand:#5FA8C9; --brand-ink:#0E181E;
  --lv1:#E5544A; --lv2:#E8793E; --lv3:#C99A2E; --lv4:#3F9E6E; --lv5:#4F8FD6;
  --z-triage:#1C6687; --z-leader:#6E4CA6; --z-peds:#B5507F; --z-resus:#B23A2C; --z-treat:#2A8570; --z-obs:#957224; --z-spec:#67822B;
  --ok:#58B884; --bad:#F0645A; --tint:#2A2414; --tint-line:#7A6430; --focus:#6AA6E8; --uc:#1C6687; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
h1,h2,h3{text-wrap:balance;margin:0}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:18px 150px;display:grid;gap:18px}
/* app bar */
.appbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--zc,var(--z-triage));color:#fff}
.appbar .in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;min-height:54px}
.appbar h1{font-size:17px;font-weight:900;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.appbar small{display:block;font-size:11.5px;font-weight:500;opacity:.85;letter-spacing:.06em}
.nbtn{border:0;background:rgba(255,255,255,.16);color:#fff;border-radius:10px;height:36px;padding:0 12px;font-size:13.5px;font-weight:700;white-space:nowrap;flex:none}
.nbtn:hover{background:rgba(255,255,255,.26)}
@media (max-width:420px){.nbtn{padding:0 9px;font-size:12.5px}.appbar .strip{display:none}}
.strip{display:flex;gap:3px}.strip i{width:7px;height:20px;border-radius:2px;display:block;box-shadow:0 0 0 1px rgba(255,255,255,.35)}
.lvbg1{background:var(--lv1)}.lvbg2{background:var(--lv2)}.lvbg3{background:var(--lv3)}.lvbg4{background:var(--lv4)}.lvbg5{background:var(--lv5)}.lvbg0{background:var(--surface-2)}
/* home */
.hello{background:var(--z-triage);color:#fff;border-radius:18px;padding:20px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center}
.hello h2{font-size:clamp(19px,3.4vw,23px);font-weight:900}
.hello p{margin:6px 0 0;opacity:.92;font-size:14px;line-height:1.65;max-width:52ch}
.hello img{width:64px;height:64px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-top:4px}
.sec-h h2{font-size:16px;font-weight:900;letter-spacing:.04em}
.sec-h a{font-size:13px;color:var(--ink-2)}
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.zone{border:0;text-align:left;border-radius:16px;padding:18px;color:#fff;display:grid;grid-template-columns:minmax(0,1fr) 56px;gap:12px;align-items:center;min-height:128px}
.zone b{font-size:17px;display:block;font-weight:900;margin-bottom:2px}
.zone span{font-size:13px;opacity:.92;line-height:1.55;display:block}
.ill{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.92);display:grid;place-items:center}
.ill img{width:40px;height:40px}
.zone .st{display:table;margin-top:10px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px;background:rgba(255,255,255,.22)}
.zone.soon{cursor:default}
.zone.soon .st{background:rgba(0,0,0,.18)}
.news{display:grid;gap:8px}
.newsitem{display:grid;grid-template-columns:auto auto minmax(0,1fr);gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 14px;text-decoration:none;color:var(--ink)}
.newsitem time{font-family:var(--f-data);font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.newsitem .ntag{font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 8px;background:var(--z-triage);color:#fff}
.newsitem span:last-child{font-size:14px;line-height:1.5}
.newsitem.nhot{border-color:var(--tint-line);background:var(--tint)}
.newsitem .ntt{font-size:14px;line-height:1.5}
.nd{display:block;padding:0}
.nd summary{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 14px;cursor:pointer;list-style:none}
.nd summary::-webkit-details-marker{display:none}
.chev{font-style:normal;font-size:18px;color:var(--ink-2);transition:transform .2s}
.nd[open] .chev{transform:rotate(90deg)}
.nd[open] summary{border-bottom:1px dashed var(--line)}
.nbody{padding:12px 14px 14px;display:grid;gap:8px;font-size:14.5px;line-height:1.75;animation:popin .3s ease}
.nbody p{margin:0}.nbody a{color:var(--brand)}
@media (max-width:520px){.nd summary{grid-template-columns:auto minmax(0,1fr) auto}.nd summary .ntag{justify-self:start}.nd summary .ntt{grid-column:1/-1;grid-row:2}.nd .chev{grid-column:3;grid-row:1}}
@media (max-width:520px){.newsitem{grid-template-columns:auto minmax(0,1fr)}.newsitem span:last-child{grid-column:1/-1}}
.extras{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.extra{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:16px 18px;text-align:left;display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;align-items:center;color:var(--ink);text-decoration:none}
.extra .ill{width:48px;height:48px;background:var(--surface-2)}.extra .ill img{width:34px;height:34px}
.extra b{font-size:16px;display:block}.extra span{font-size:13px;color:var(--ink-2);line-height:1.5}
.newsitem .ntag{justify-self:start}
.zones{grid-template-columns:1fr}
@media (min-width:560px){.zones{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:900px){.zones{grid-template-columns:repeat(3,minmax(0,1fr))}}
.extras{grid-template-columns:1fr}
@media (min-width:560px){.extras{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (min-width:980px){.extras.four{grid-template-columns:repeat(4,minmax(0,1fr))}}

.zone .yr{display:inline-block;font-size:11.5px;font-weight:700;letter-spacing:.06em;border-radius:6px;padding:1px 8px;background:rgba(255,255,255,.22);margin-bottom:6px;opacity:1}
/* zone hub */
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.mod{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:18px;text-align:left;display:grid;gap:4px;align-content:start;color:var(--ink);text-decoration:none}
.mod img{width:40px;height:40px}
.mod b{font-size:16px}
.mod span{font-size:13px;color:var(--ink-2)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0}
.stack{display:grid;gap:12px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.label{font-size:12px;letter-spacing:.08em;color:var(--ink-2);font-weight:700}
.hint{font-size:13px;color:var(--ink-2)}
.note{background:var(--tint);border:1.5px solid var(--tint-line);border-radius:12px;padding:10px 12px;font-size:13.5px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:14px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--z-triage);color:#fff;border-color:var(--z-triage)}
.btn{border:0;border-radius:10px;padding:10px 18px;font-weight:700;background:var(--z-triage);color:#fff}
.btn.ghost{background:transparent;color:var(--z-triage);border:1.5px solid var(--z-triage)}
:root:not([data-theme="light"]) .btn.ghost{color:var(--ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
input[type=text],input[type=search]{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 14px;width:100%;min-width:0;font-size:16px}
/* bottom nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabs a{display:grid;justify-items:center;gap:0;padding:7px 4px 8px;text-decoration:none;color:var(--ink-2);font-size:12px;font-weight:700}
.tabs a i{font-style:normal;font-size:20px;line-height:1.2}
.tabs a[aria-current="page"]{color:var(--tabc,var(--z-triage))}
:root:not([data-theme="light"]) .tabs a[aria-current="page"]{color:var(--ink)}
/* lookup */
.seg4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
@media (max-width:460px){.seg4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.seg4 button{border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:8px;text-align:left}
.seg4 b{display:block;font-size:15px}.seg4 span{font-size:11.5px;color:var(--ink-2)}
.seg4 button[aria-pressed="true"]{background:var(--z-triage);border-color:var(--z-triage);color:#fff}
.seg4 button[aria-pressed="true"] span{color:#fff;opacity:.85}
.syschips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.cpls{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;max-height:300px;overflow:auto;padding:2px}
.cpls button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;text-align:left;font-size:14px;line-height:1.35}
.cpls button small{display:block;font-family:var(--f-data);font-size:11px;color:var(--ink-2)}
.cpls button[aria-pressed="true"]{border-color:var(--z-triage);background:var(--surface-2);font-weight:700}
.chosen{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chosen b{font-size:19px}
.grp{font-size:13px;font-weight:900;color:var(--ink);margin:12px 0 6px;display:flex;gap:8px;align-items:center}
.grp::after{content:"";flex:1;height:1px;background:var(--line)}
.cri{display:grid;gap:6px}
.cri label{display:grid;grid-template-columns:22px 52px minmax(0,1fr);gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--surface);cursor:pointer;line-height:1.45}
.cri label:has(input:checked){border-color:var(--z-triage);background:var(--surface-2)}
.cri input{width:20px;height:20px;accent-color:var(--z-triage);margin:0}
.lvp{display:inline-grid;place-items:center;height:26px;border-radius:8px;color:#fff;font-weight:900;font-size:12.5px}
.lv{display:inline-grid;place-items:center;min-width:30px;height:26px;padding:0 6px;border-radius:7px;color:#fff;font-weight:700;font-family:var(--f-data);font-size:14px}
.l1{background:var(--lv1)}.l2{background:var(--lv2)}.l3{background:var(--lv3)}.l4{background:var(--lv4)}.l5{background:var(--lv5)}.l0{background:var(--line);color:var(--ink-2)}
.star{color:var(--z-triage);font-weight:900}
:root:not([data-theme="light"]) .star{color:var(--ink)}
/* result dock */
.dock{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:25;padding:0 10px}
.dock .in{max-width:800px;margin:0 auto;border-radius:16px;background:#7C8A96;color:#fff;padding:10px 14px;display:flex;gap:12px;align-items:center;box-shadow:0 8px 24px rgba(0,0,0,.18);transition:background .25s}
.dock .in.d1{background:var(--lv1)}.dock .in.d2{background:var(--lv2)}.dock .in.d3{background:var(--lv3)}.dock .in.d4{background:var(--lv4)}.dock .in.d5{background:var(--lv5)}
.dock .big{font-size:30px;font-weight:900;font-family:var(--f-data);line-height:1;min-width:36px;text-align:center}
.dock .txt{flex:1;min-width:0;display:grid;line-height:1.35}
.dock .txt b{font-size:16px}
.dock .txt span{font-size:12.5px;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dock button{border:0;background:rgba(255,255,255,.22);color:#fff;border-radius:10px;padding:8px 12px;font-weight:700;white-space:nowrap}
.dock button:disabled{opacity:.5}
.drivers{display:grid;gap:4px}
/* practice */
.case-text{font-size:18px;line-height:1.7;margin:0}
.vitals{font-family:var(--f-data);font-size:14px;background:var(--surface-2);border-radius:8px;padding:8px 12px;overflow-wrap:anywhere}
.ptag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px;background:var(--surface-2);color:var(--ink-2)}
.pbar{height:5px;background:var(--surface-2);border-radius:4px;overflow:hidden}.pbar>i{display:block;height:100%;background:var(--z-triage);transition:width .3s}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:12px;padding:10px 12px}
.stat b{display:block;font-family:var(--f-data);font-size:24px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-2)}
.verdict{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.verdict .mark{font-size:28px;font-weight:900}
.ok{color:var(--ok)}.bad{color:var(--bad)}
.kv{display:grid;grid-template-columns:6.5em minmax(0,1fr);gap:6px 12px;font-size:14px;margin:0}
.kv dt{color:var(--ink-2)}.kv dd{margin:0}
.why{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.review{display:grid;gap:8px}
.review button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center}
textarea{width:100%;min-height:110px;font-family:var(--f-data);font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);padding:8px}
/* reference */
.refnav{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.refcard h3{font-size:18px;display:flex;align-items:center;gap:10px}
.refcard h3 img{width:36px;height:36px}
.vizbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vb{border:0;border-radius:999px;padding:6px 14px;font-size:13.5px;font-weight:700;background:var(--z-triage);color:#fff}
.vb.all{background:var(--surface-2);color:var(--ink)}
.vb-n{font-family:var(--f-data);font-size:12.5px;color:var(--ink-2)}
.veil{opacity:.08;filter:grayscale(1);transition:opacity .35s,filter .35s}
.pop{animation:pop .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes pop{0%{transform:scale(.94);opacity:.2}100%{transform:none;opacity:1}}
.view{animation:enter .35s ease both}
@keyframes enter{from{opacity:.0;transform:translateY(8px)}to{opacity:1;transform:none}}
.foot{font-size:12px;color:var(--ink-2)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* pgy */
.road{display:grid;gap:10px}
.rstep{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.rstep .no{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-data);font-weight:600;background:var(--surface-2)}
.rstep.done .no{background:var(--ok);color:#fff}
.rstep b{display:block;font-size:15px}.rstep span{font-size:13px;color:var(--ink-2)}
.rstep a{font-size:13px;font-weight:700;color:var(--z-triage);white-space:nowrap}
:root:not([data-theme="light"]) .rstep a{color:var(--ink)}
.rstep input{width:22px;height:22px;accent-color:var(--ok)}
.meter{height:10px;border-radius:6px;background:var(--surface-2);overflow:hidden}.meter i{display:block;height:100%;background:var(--ok);transition:width .4s}
.works{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.work{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:6px;align-content:start}
.work .k{justify-self:start;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 8px;background:var(--z-leader);color:#fff}
.work b{font-size:16px}.work p{margin:0;font-size:13.5px;color:var(--ink-2);line-height:1.6}
.work small{font-size:12px;color:var(--ink-2)}
.gamebox{display:grid;gap:14px}
.ghead{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.timer{font-family:var(--f-data);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.timer.low{color:var(--bad)}
.score{font-family:var(--f-data);font-size:22px;font-weight:600}
.combo{font-size:13px;font-weight:700;color:var(--lv2)}
.gcase{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;gap:10px;min-height:150px;align-content:start}
.gcase p{margin:0;font-size:17px;line-height:1.7}
.lvbtns{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lvbtns button{border:0;border-radius:14px;color:#fff;font-weight:900;padding:14px 4px;display:grid;gap:2px;justify-items:center;font-size:24px;font-family:var(--f-data)}
.lvbtns button small{font-family:var(--f-body);font-size:11.5px;font-weight:700}
.lvbtns button:active{transform:scale(.96)}
.flashmsg{border-radius:12px;padding:10px 14px;font-weight:700;font-size:14px}
.flashmsg.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}.flashmsg.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.bigscore{font-family:var(--f-data);font-size:56px;font-weight:600;line-height:1}

/* leader */
.steps4{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.s4{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:grid;gap:4px;align-content:start}
.s4 i{font-style:normal;width:34px;height:34px;border-radius:50%;background:var(--z-leader);color:#fff;display:grid;place-items:center;font-family:var(--f-data);font-weight:600}
.s4 small{font-family:var(--f-data);font-size:12.5px;color:var(--ink-2)}.s4 b{font-size:16px}.s4 span{font-size:13.5px;color:var(--ink-2);line-height:1.6}
.pts2{display:grid;gap:6px;font-size:14.5px}
.ox{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:520px){.ox{grid-template-columns:1fr}}
.ox div{background:var(--surface-2);border-radius:12px;padding:12px;display:grid;gap:2px}
.ox span:not(.mk){font-size:13px;color:var(--ink-2)}
.mk{font-size:26px;font-weight:900;line-height:1}.mk.o{color:var(--ok)}.mk.t{color:var(--lv3)}.mk.x{color:var(--bad)}
ul.plain{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:14.5px;line-height:1.65}
h3.bh{font-size:17px;font-weight:900}
.qbox{background:var(--tint);border:1.5px solid var(--tint-line);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.7}
.cgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.cc{background:var(--surface-2);border-radius:12px;padding:12px 14px;display:grid;gap:4px;align-content:start}
.cc b{font-size:15px}.cc span{font-size:13.5px;color:var(--ink-2);line-height:1.65}
.cmp{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:560px){.cmp{grid-template-columns:1fr}}
.cside{border-radius:12px;padding:14px;background:var(--surface-2);display:grid;gap:4px;align-content:start}
.cside.r{background:color-mix(in srgb,var(--z-leader) 14%,var(--surface))}
.cside b{font-size:15.5px}.cside span{font-size:13px;color:var(--ink-2)}
.cside ul{margin:4px 0 0;padding-left:1.1em;font-size:14px;line-height:1.7}
.tblw{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tblw table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.55}
.tblw th{background:color-mix(in srgb,var(--z-leader) 14%,var(--surface));text-align:left;padding:8px 12px;white-space:nowrap}
.tblw td{padding:8px 12px;border-top:1px solid var(--line);vertical-align:top}
.book{display:grid;gap:8px}
.bi{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.bi.done{background:color-mix(in srgb,var(--ok) 9%,var(--surface));border-color:color-mix(in srgb,var(--ok) 40%,var(--line))}
.bi>span{font-size:14.5px;line-height:1.5}
.rounds{display:flex;gap:4px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rounds small{font-size:11.5px;color:var(--ink-2);margin:0 2px 0 6px}
.oxb{width:32px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--surface);font-weight:900;font-size:15px;padding:0}
.oxb.on.o{background:var(--ok);border-color:var(--ok);color:#fff}.oxb.on.t{background:var(--lv3);border-color:var(--lv3);color:#fff}.oxb.on.x{background:var(--bad);border-color:var(--bad);color:#fff}
@media (max-width:560px){.bi{grid-template-columns:1fr}.rounds{justify-content:flex-start}}
.sent{font-size:16px;line-height:2.4}
.sent input{display:inline-block;width:8.5em;padding:5px 10px;font-size:15px;border-radius:8px;margin:0 2px}
.sent input[data-f="min"]{width:4em}.sent input[data-f="why"]{width:12em}

/* assess */
.tabs .in{grid-template-columns:repeat(5,1fr)}
.audit{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:6px}
.aitem{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center;text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 10px;font-size:14px}
.aitem b{font-family:var(--f-data);font-size:13px;color:var(--ink-2)}
.aitem[aria-pressed="true"]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.aitem[aria-pressed="true"] b{color:var(--bad)}
.aitem.right{box-shadow:inset 0 0 0 2px var(--ok)}
.aitem.wrong{box-shadow:inset 0 0 0 2px var(--lv3)}
.aitem.isbad span::after{content:"　✗ 不合格";color:var(--bad);font-weight:700}
.opts{display:grid;gap:8px}
.opts button{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;font-size:15px;line-height:1.5}
.opts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,var(--surface));font-weight:700}
.opts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 10%,var(--surface))}
.bigscore.ok{color:var(--ok)}.bigscore.bad{color:var(--bad)}

/* quest map */
.qmap{position:relative;width:100%;max-width:420px;margin:0 auto}
.qmap svg{position:absolute;inset:0;width:100%;height:100%}
.qnode{position:absolute;left:50%;transform:translateX(calc(-50% + var(--x)));display:grid;justify-items:center;gap:4px;width:140px;text-decoration:none;color:var(--ink);z-index:1}
.qdot{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-data);font-weight:600;font-size:22px;color:#fff;background:var(--zc2);box-shadow:0 6px 0 color-mix(in srgb,var(--zc2) 60%,#000),0 8px 18px rgba(0,0,0,.18);border:3px solid var(--surface)}
.qnode.done .qdot{background:var(--ok);box-shadow:0 6px 0 color-mix(in srgb,var(--ok) 60%,#000),0 8px 18px rgba(0,0,0,.18)}
.qnode.lock .qdot{background:var(--surface-2);color:var(--ink-2);box-shadow:0 5px 0 var(--line);font-size:20px}
.qnode.boss .qdot{width:76px;height:76px;font-size:26px;background:var(--lv1);box-shadow:0 6px 0 color-mix(in srgb,var(--lv1) 60%,#000),0 8px 18px rgba(0,0,0,.2)}
.qnode.boss.lock .qdot{background:var(--surface-2);box-shadow:0 5px 0 var(--line)}
.qnode.cur .qdot{animation:qpulse 1.6s ease-in-out infinite}
@keyframes qpulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.qlab{display:grid;justify-items:center;text-align:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px 8px;line-height:1.35}
.qlab b{font-size:13px}.qlab small{font-size:11.5px;color:var(--lv3);letter-spacing:.06em}
.qnode.lock .qlab{opacity:.75}.qnode.lock .qlab small{color:var(--ink-2)}
.qregion{position:absolute;left:0;font-size:11.5px;font-weight:900;letter-spacing:.08em;color:var(--zc2);background:color-mix(in srgb,var(--zc2) 12%,var(--surface));border-radius:999px;padding:2px 10px;z-index:2}
:root:not([data-theme="light"]) .qregion{color:var(--ink)}
.qbadge{width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--ink);display:grid;place-items:center;font-family:var(--f-data);font-weight:600;font-size:26px}
.qstars{font-size:44px;color:var(--lv3);letter-spacing:.1em;line-height:1}
.qbanner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;border-radius:16px;padding:16px 18px;text-decoration:none;color:#fff;background:linear-gradient(0deg,var(--z-triage),var(--z-triage))}
.qbanner b{font-size:17px;display:block}.qbanner span{font-size:13px;opacity:.92}
.qbanner .go{background:rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-weight:700;font-size:13.5px;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.qnode.cur .qdot{animation:none}}

/* career map */
.career{display:grid;gap:0;position:relative}
.cst{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;position:relative;padding-bottom:18px}
.cst::before{content:"";position:absolute;left:37px;top:0;bottom:0;width:6px;background:var(--line);border-radius:3px}
.cst:last-child::before{bottom:auto;height:40px}
.cst.past::before{background:var(--cc)}
.cyr{position:relative;z-index:1;display:grid;justify-items:center}
.cyr span{width:76px;height:76px;border-radius:50%;background:var(--surface);border:4px solid var(--cc);display:grid;place-items:center;font-weight:900;font-size:14px;text-align:center;line-height:1.2;color:var(--ink);padding:4px}
.cst.past .cyr span,.cst.now .cyr span{background:var(--cc);color:#fff}
.cst.now .cyr span{animation:qpulse 1.8s ease-in-out infinite;box-shadow:0 0 0 6px color-mix(in srgb,var(--cc) 25%,transparent)}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:grid;gap:10px;min-width:0}
.cst.now .ccard{border:2px solid var(--cc)}
.chead{display:flex;gap:12px;align-items:center}
.chead .ill{width:48px;height:48px;background:var(--surface-2)}.chead .ill img{width:34px;height:34px}
.chead b{font-size:18px;display:block}
.ctag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:1px 10px;background:color-mix(in srgb,var(--cc) 16%,var(--surface));color:var(--ink)}
.ccard p{margin:0;font-size:14.5px;line-height:1.65;color:var(--ink-2)}
.cprog{display:grid;gap:4px}.cprog span{font-size:13px;font-weight:700}
.prelist{display:grid;gap:6px}
.prelist label{display:flex;gap:10px;align-items:center;font-size:14px;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.prelist input{width:20px;height:20px;accent-color:var(--cc)}
.qregion.r{left:auto;right:0}
@media (prefers-reduced-motion:reduce){.cst.now .cyr span{animation:none}}

/* resus body map */
.bodywrap{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:640px){.bodywrap{grid-template-columns:1fr}}
.body{position:relative;width:100%;max-width:260px;justify-self:center}
.body svg{width:100%;height:auto;display:block}
.hot{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:grid;justify-items:center}
.hot::before{content:"";width:22px;height:22px;border-radius:50%;background:var(--z-resus);box-shadow:0 0 0 4px color-mix(in srgb,var(--z-resus) 30%,transparent);animation:hotp 1.8s ease-in-out infinite}
.hot span{position:absolute;top:24px;white-space:nowrap;font-size:11.5px;font-weight:700;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 6px;color:var(--ink)}
.hot.on::before{background:var(--lv3);box-shadow:0 0 0 6px color-mix(in srgb,var(--lv3) 35%,transparent)}
@keyframes hotp{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--z-resus) 10%,transparent)}}
.bodyside{display:grid;gap:10px;align-content:start;min-width:0}
.wisdom{background:var(--tint);border-color:var(--tint-line)}
.tip{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;font-size:14.5px;line-height:1.7}
.tip::before{content:"💡";font-size:16px}
@media (prefers-reduced-motion:reduce){.hot::before{animation:none}}

/* resus handbook & drugs */
.catrow{display:flex;flex-wrap:wrap;gap:6px}
.catchip{font-size:12.5px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--surface-2);color:var(--ink-2)}
.catchip.ok{background:color-mix(in srgb,var(--ok) 16%,var(--surface));color:var(--ink)}
.oxb.tb{width:auto;padding:0 8px;font-size:13px}
@media (max-width:440px){.rounds{gap:3px}.rounds .oxb{width:28px;height:28px;font-size:13px;border-radius:7px}.rounds .oxb.tb{width:auto;padding:0 6px}.rounds small{margin:0 1px 0 4px}}
.drugs{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.drug{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:8px}
.drug.done{border-color:color-mix(in srgb,var(--ok) 50%,var(--line));background:color-mix(in srgb,var(--ok) 6%,var(--surface))}
.dno{width:30px;height:30px;border-radius:50%;background:var(--z-resus);color:#fff;display:grid;place-items:center;font-family:var(--f-data);font-weight:600;font-size:14px}
.drug input{font-weight:700}
.drug textarea{min-height:58px;font-family:var(--f-body);font-size:14px}

/* ---------- visual components ---------- */
.viz{margin:18px 0 22px;display:grid;gap:10px}
.viz .cap{font-size:12.5px;color:var(--ink-2)}
.lvbg1{background:var(--lv1)}.lvbg2{background:var(--lv2)}.lvbg3{background:var(--lv3)}.lvbg4{background:var(--lv4)}.lvbg5{background:var(--lv5)}.lvbg0{background:var(--surface-2)}
/* level ladder */
.ladder{display:grid;gap:8px}
.rung{display:grid;grid-template-columns:86px minmax(0,1fr);border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface)}
.rung .num{color:#fff;display:grid;place-items:center;text-align:center;padding:10px 4px}
.rung .num b{font-family:var(--f-data);font-size:30px;line-height:1}
.rung .num small{display:block;font-size:12px;font-weight:700;margin-top:4px}
.rung .body{padding:10px 14px;display:grid;gap:4px;min-width:0}
.rung .top{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline}
.rung .top b{font-size:17px}
.rung .clock{font-family:var(--f-data);font-size:13px;color:var(--ink-2)}
.rung .eg{font-size:14px;color:var(--ink-2)}
/* flow */
.flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
@media (max-width:640px){.flow{grid-template-columns:1fr}}
.fstep{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:6px;position:relative}
.fstep .k{font-family:var(--f-data);font-size:12px;color:var(--brand);font-weight:600;letter-spacing:.08em}
.fstep b{font-size:16px}
.fstep p{margin:0;font-size:14px;color:var(--ink-2)}
.route{display:grid;gap:6px;margin-top:4px}
.route div{display:flex;gap:8px;align-items:center;font-size:13.5px}
.route i{width:12px;height:12px;border-radius:3px;flex:none}
.arrow{color:var(--ink-2);text-align:center;font-size:20px;line-height:1}
/* scale bar */
.scale{display:grid;gap:6px}
.bar{display:flex;border-radius:10px;overflow:hidden;border:1px solid var(--line);min-height:54px}
.seg{color:#fff;padding:6px 8px;display:grid;align-content:center;gap:2px;min-width:0}
.seg b{font-family:var(--f-data);font-size:14px;white-space:nowrap}
.seg span{font-size:12px;line-height:1.3}
.seg.ok{background:var(--surface-2);color:var(--ink)}
.ticks{display:flex;font-family:var(--f-data);font-size:11.5px;color:var(--ink-2)}
/* pain grid */
.pgrid{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:6px;align-items:stretch;max-width:560px}
.pgrid .h{font-size:13px;color:var(--ink-2);font-weight:700;display:grid;place-items:center;text-align:center;padding:4px}
.pgrid .c{border-radius:10px;color:#fff;display:grid;place-items:center;padding:12px 6px;text-align:center}
.pgrid .c b{font-family:var(--f-data);font-size:24px;line-height:1}
.pgrid .c small{font-size:11.5px}
/* timeline */
.tl{position:relative;height:96px;margin:6px 8px 0}
.tl .axis{position:absolute;left:0;right:0;top:44px;height:4px;background:var(--line);border-radius:2px}
.tl .mk{position:absolute;top:0;transform:translateX(-50%);display:grid;justify-items:center;gap:4px;text-align:center}
.tl .mk .dot{width:16px;height:16px;border-radius:50%;margin-top:36px;border:3px solid var(--surface)}
.tl .mk b{font-family:var(--f-data);font-size:13px;white-space:nowrap}
.tl .mk span{font-size:11.5px;color:var(--ink-2);white-space:nowrap}
.tl .lbl{position:absolute;top:2px;transform:translateX(-50%);display:grid;justify-items:center}
/* chips row / stepper */
.stepper{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.chipcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;display:grid;gap:4px;flex:1 1 150px;min-width:0}
.chipcard .k{font-family:var(--f-data);font-size:12px;color:var(--brand);font-weight:600}
.chipcard b{font-size:15px}
.chipcard p{margin:0;font-size:13.5px;color:var(--ink-2)}
.tagrow{display:flex;flex-wrap:wrap;gap:4px}
.tag{display:inline-flex;gap:4px;align-items:center;font-size:12px;border-radius:999px;padding:2px 8px;color:#fff;font-weight:700}
/* mechanism */
.moi{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.moi .m{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px;display:grid;gap:4px;align-content:start}
.moi .m .big{font-family:var(--f-data);font-size:22px;font-weight:600;color:var(--lv2);line-height:1.2}
.moi .m b{font-size:14.5px}
.moi .m p{margin:0;font-size:13px;color:var(--ink-2)}
.moi-h{font-size:13px;font-weight:700;color:var(--ink-2);letter-spacing:.06em;margin-top:6px}
/* PAT */
.pat{display:grid;grid-template-columns:minmax(0,280px) minmax(0,1fr);gap:16px;align-items:center}
@media (max-width:640px){.pat{grid-template-columns:1fr}}
.pat svg{width:100%;height:auto;max-width:280px;justify-self:center}
.pat svg .side{cursor:pointer}
.pat svg text{font-family:var(--f-body);font-size:13px;fill:var(--ink)}
.pat-out{border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--surface);display:grid;gap:6px;min-width:0}
.pat-out .state{font-size:19px;font-weight:900}
.pat-btns{display:flex;flex-wrap:wrap;gap:6px}
.pat-btns button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font:inherit;font-size:13.5px;color:var(--ink);cursor:pointer}
.pat-btns button[aria-pressed="true"]{background:var(--lv1);border-color:var(--lv1);color:#fff}
/* HR range chart */
.hr{display:grid;gap:10px}
.hrrow{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px;align-items:center}
.hrrow .age{font-size:13.5px;font-weight:700}
.hrtrack{position:relative;height:30px;border-radius:6px;overflow:hidden;background:var(--lv1)}
.hrtrack i{position:absolute;top:0;bottom:0}
.hrtrack em{position:absolute;top:50%;transform:translate(-50%,-50%);font-style:normal;font-family:var(--f-data);font-size:11px;color:#fff;font-weight:600}
.hraxis{display:grid;grid-template-columns:92px minmax(0,1fr);gap:8px}
.hraxis div{position:relative;height:16px;font-family:var(--f-data);font-size:11px;color:var(--ink-2)}
.hraxis span{position:absolute;transform:translateX(-50%)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
/* compare say */
.say{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
@media (max-width:560px){.say{grid-template-columns:1fr}}
.say .no,.say .yes{border-radius:10px;padding:9px 12px;font-size:14.5px}
.say .no{background:var(--surface-2);color:var(--ink-2);text-decoration:line-through;text-decoration-color:var(--lv1)}
.say .yes{background:var(--surface);border:1px solid var(--lv4)}
.say .hd{font-size:12px;font-weight:700;letter-spacing:.08em}
/* START */
.start{display:grid;gap:8px}
.q{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px}
.q b{font-size:15px}
.q .ans{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.tri{border-radius:8px;padding:4px 10px;font-size:13px;font-weight:700;color:#fff;white-space:nowrap}
.tri.g{background:var(--lv4)}.tri.y{background:var(--lv3)}.tri.r{background:var(--lv1)}.tri.k{background:#1f2328}
/* case cards */
.cases{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin:12px 0 18px}
.case{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:12px 14px;display:grid;gap:8px;align-content:start}
.case .no{font-family:var(--f-data);font-size:12px;color:var(--brand);font-weight:600}
.case p{margin:0;font-size:14.5px;line-height:1.6}
.case .vs{font-family:var(--f-data);font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:6px;padding:4px 8px}
.case button{justify-self:start;border:1px solid var(--brand);color:var(--brand);background:transparent;border-radius:8px;padding:5px 12px;font:inherit;font-size:13px;font-weight:700;cursor:pointer}
.case .reveal{border-top:1px dashed var(--line);padding-top:8px;display:grid;gap:4px;font-size:13.5px}
.case .reveal .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.case .cap{font-size:12.5px;color:var(--ink-2)}
.case .reveal[hidden]{display:none}
.case .reveal .row b{font-size:12.5px;color:var(--ink-2);min-width:4.5em}
.case .reveal .row span{flex:1 1 180px;min-width:0}

/* wards */
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-7px) rotate(-3deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes zz{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(10px,-18px) scale(1.1)}}
@keyframes wob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes popin{0%{opacity:0;transform:translateY(8px) scale(.97)}100%{opacity:1;transform:none}}
@keyframes rise{0%{opacity:0;transform:translateY(10px)}100%{opacity:1;transform:none}}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--bad) 45%,transparent)}50%{box-shadow:0 0 0 7px transparent}}
@keyframes fall{0%{transform:translateY(-10vh) rotate(0)}100%{transform:translateY(110vh) rotate(540deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.mascot{display:grid;grid-template-columns:76px minmax(0,1fr);gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px}
.mimg{width:76px;height:76px;border-radius:50%;background:color-mix(in srgb,var(--mc) 16%,var(--surface));display:grid;place-items:center}
.mimg img{width:60px;height:60px;animation:bob 2.6s ease-in-out infinite}
.bubble{position:relative;background:color-mix(in srgb,var(--mc) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--mc) 30%,var(--line));border-radius:14px;padding:11px 14px;font-size:15px;line-height:1.65;color:var(--ink);min-height:52px}
.bubble::before{content:"";position:absolute;left:-7px;top:20px;width:12px;height:12px;background:inherit;border-left:1px solid color-mix(in srgb,var(--mc) 30%,var(--line));border-bottom:1px solid color-mix(in srgb,var(--mc) 30%,var(--line));transform:rotate(45deg)}
.bubble.swap{animation:popin .35s ease}
.bnx{grid-column:2;justify-self:end;padding:6px 12px;font-size:13px}
.ward{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.bed{position:relative;border:2px solid var(--line);border-radius:14px;background:var(--surface-2);padding:8px 2px 6px;display:grid;justify-items:center;gap:2px;cursor:pointer;color:var(--ink);font:inherit;transition:transform .15s,border-color .15s}
.bed:hover,.walker:hover{transform:translateY(-2px)}
.bed.on,.walker.on{border-color:var(--z-treat);background:color-mix(in srgb,var(--z-treat) 12%,var(--surface))}
.bno{font-size:12px;font-weight:800;color:var(--ink-2)}
.bimg{position:relative;display:block}
.bimg img{width:42px;height:42px;animation:breathe 3.2s ease-in-out infinite;animation-delay:var(--d)}
.zz{position:absolute;right:-4px;top:-4px;font-style:normal;font-weight:900;font-size:12px;color:var(--z-treat);animation:zz 2.4s ease-out infinite;animation-delay:var(--d)}
.bed small{font-size:12.5px;font-weight:700}
.waitrow{display:flex;flex-wrap:wrap;gap:8px}
.walker{display:flex;align-items:center;gap:6px;border:2px solid var(--line);border-radius:999px;background:var(--surface);padding:4px 12px 4px 4px;cursor:pointer;font:inherit;color:var(--ink);transition:transform .15s}
.walker img{width:30px;height:30px;animation:wob 1.8s ease-in-out infinite;animation-delay:var(--d)}
.walker span{font-size:13px;display:grid;line-height:1.25;text-align:left}.walker b{font-size:11px;color:var(--ink-2)}
.pop{animation:popin .35s ease}
#wpick:not(:empty){margin-top:4px}
.wladder,.stuck{display:grid;gap:8px}
.wrung{border-radius:12px;background:color-mix(in srgb,var(--zc) calc(26% - var(--i,2) * 4%),var(--surface));border:1px solid var(--line);padding:0;animation:rise .4s both;animation-delay:calc(var(--i,0) * 70ms)}
.wrung summary{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;list-style:none;font-size:15.5px}
.wrung summary::-webkit-details-marker{display:none}
.wrung summary::after{content:"＋";margin-left:auto;color:var(--ink-2)}.wrung[open] summary::after{content:"－"}
.rn{width:28px;height:28px;border-radius:50%;background:var(--zc);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.wrung p{margin:0;padding:0 14px 12px;line-height:1.7;font-size:14.5px;animation:popin .3s ease}
.order{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.order span{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:5px 12px;font-weight:700;animation:rise .4s both;animation-delay:calc(var(--i) * 90ms)}
.order span:first-child{background:var(--bad);color:#fff;border-color:transparent}
.order i{font-style:normal;color:var(--ink-2)}
.pat{position:relative;max-width:360px;width:100%;margin:6px auto 30px;aspect-ratio:300/260}
.pat svg{position:absolute;inset:0;width:100%;height:100%}
.ps{stroke:var(--line);stroke-width:12;stroke-linecap:round;transition:stroke .25s}
.pat[data-s="1"] .ps1,.pat[data-s="3"] .ps1,.pat[data-s="5"] .ps1,.pat[data-s="7"] .ps1,
.pat[data-s="2"] .ps2,.pat[data-s="3"] .ps2,.pat[data-s="6"] .ps2,.pat[data-s="7"] .ps2,
.pat[data-s="4"] .ps4,.pat[data-s="5"] .ps4,.pat[data-s="6"] .ps4,.pat[data-s="7"] .ps4{stroke:var(--bad)}
.pkid{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:84px;height:84px;border-radius:50%;background:var(--surface);border:2px solid var(--line);display:grid;place-items:center}
.pkid img{width:62px;height:62px;animation:bob 2.6s ease-in-out infinite}
.pat.lvbad .pkid{border-color:var(--bad);animation:pulse 1.4s infinite}.pat.lvbad .pkid img{animation:shake .5s 2}
.pside{position:absolute;transform:translate(-50%,-50%);display:grid;gap:1px;background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:6px 10px;font:inherit;color:var(--ink);cursor:pointer;text-align:center;max-width:46%;transition:border-color .2s,background .2s}
.pside b{font-size:14.5px}.pside small{font-size:11.5px;color:var(--ink-2);line-height:1.35}
.pside[aria-pressed="true"]{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.pside b{white-space:nowrap}.pside[aria-pressed="true"]::after{content:"異常";display:block;font-size:12px;font-weight:900;color:#fff;background:var(--bad);border-radius:999px;padding:1px 8px;justify-self:center}
.patres{display:grid;gap:3px;border-radius:12px;padding:12px 14px;border-left:6px solid var(--ok);background:color-mix(in srgb,var(--ok) 10%,var(--surface));animation:popin .3s ease}
.patres.warn{border-color:var(--lv3);background:color-mix(in srgb,var(--lv3) 12%,var(--surface))}
.patres.bad{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 11%,var(--surface))}
.patres b{font-size:16px}.patres span{font-size:14.5px;line-height:1.6}
.flips{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.flip{perspective:900px;background:none;border:0;padding:0;font:inherit;color:var(--ink);cursor:pointer;text-align:left}
.fin{display:grid;transition:transform .55s cubic-bezier(.3,.7,.3,1);transform-style:preserve-3d;height:100%}
.flip.on .fin{transform:rotateY(180deg)}
.ff{grid-area:1/1;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;border:1px solid var(--line);padding:14px;display:grid;gap:8px;align-content:start;min-height:150px}
.front{background:color-mix(in srgb,var(--z-peds) 8%,var(--surface))}
.front b{font-size:15.5px;line-height:1.55}.front small{color:var(--ink-2);font-size:12.5px}
.back{background:var(--surface);transform:rotateY(180deg);font-size:14px;line-height:1.65}
.fret{color:var(--bad)}
.fhead{display:flex;align-items:center;gap:8px}.fhead img{width:30px;height:30px;animation:bob 2.8s ease-in-out infinite}
.wmod{animation:rise .4s both;animation-delay:calc(var(--i) * 50ms)}
.wmod img{transition:transform .2s}.wmod:hover img{transform:scale(1.12) rotate(-6deg)}
.hbob img{animation:bob 2.6s ease-in-out infinite}
.layers{display:flex;flex-wrap:wrap;gap:6px}
.layer{border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:999px;padding:8px 16px;font:inherit;font-weight:700;font-size:14.5px;cursor:pointer}
.layer[aria-pressed="true"]{background:var(--zc);border-color:transparent;color:#fff}
#lp{animation:popin .3s ease}
.wst{animation:rise .4s both;animation-delay:calc(var(--i,0) * 70ms)}
.redf{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.redf li{position:relative;padding:10px 12px 10px 34px;border-radius:12px;background:color-mix(in srgb,var(--bad) 9%,var(--surface));border:1px solid color-mix(in srgb,var(--bad) 30%,var(--line));font-size:14.5px;line-height:1.55}

/* ===== 第 7 批：滿版地圖、勳章、人型圖、判斷技巧、線上教材 ===== */
.bmall,.bmsheet,.jrow,.mcard{--zz:var(--brand);--zt:color-mix(in oklab,var(--zz) var(--ta),var(--surface));--zt2:color-mix(in oklab,var(--zz) var(--tb),var(--surface));--zb:color-mix(in oklab,var(--zz) 26%,var(--line));--zi:color-mix(in oklab,var(--zz) var(--ti),var(--ink))}
.bmall[style],.bmsheet[style],.jrow[style],.mcard[style]{--zt:color-mix(in oklab,var(--zz) var(--ta),var(--surface))}
.bmall{display:contents}
body.noscroll{overflow:hidden}
/* 滿版闖關地圖 */
.qmap{max-width:none;width:calc(100% + 32px);margin-inline:-16px;border-radius:0;border-inline:0}
@media (min-width:700px){.qmap{border-radius:26px;border-inline:1px solid var(--line)}}
.q-grid{fill:none;stroke:color-mix(in srgb,var(--ink) 7%,transparent);stroke-width:1}
.q-compass circle{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
.q-compass .cn{fill:var(--lv1)}.q-compass .cs{fill:var(--ink-2)}.q-compass .ce{fill:var(--line)}
.q-compass text{font:700 10px var(--f-data);fill:var(--ink-2)}
.qpin{position:absolute;top:-30px;left:50%;transform:translateX(-50%);background:var(--warm);color:#fff;font-size:11.5px;font-weight:700;border-radius:999px;padding:2px 10px;white-space:nowrap;box-shadow:0 6px 14px -6px var(--warm);z-index:2}
.qpin::after{content:"";position:absolute;left:50%;bottom:-5px;transform:translateX(-50%);border:5px solid transparent;border-bottom:0;border-top-color:var(--warm)}
@media (prefers-reduced-motion:no-preference){.qpin{animation:bob 1.8s ease-in-out infinite}}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
.qhead{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.qmedal{text-decoration:none;line-height:0}
/* 勳章 */
.medal{--ms:72px;position:relative;display:inline-block;width:var(--ms);height:calc(var(--ms) * 86 / 72);flex:none;vertical-align:middle}
.medal svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.medal .mimg{position:absolute;left:50%;top:60.5%;width:calc(var(--ms) * .4);height:calc(var(--ms) * .4);transform:translate(-50%,-50%);display:grid;place-items:center}
.medal .mimg img{width:100%;height:100%}
.mrib1{fill:var(--zz,var(--brand))}.mrib2{fill:color-mix(in oklab,var(--zz,var(--brand)) 72%,#000)}
.mstar{fill:#fff;opacity:.95}
.m-gold .mrim{fill:#E3A82B;stroke:#F6D27A;stroke-width:2}.m-gold .mface{fill:#FFF1C9}
.m-silver .mrim{fill:#AEB9C4;stroke:#DCE3EA;stroke-width:2}.m-silver .mface{fill:#F1F4F7}
.m-bronze .mrim{fill:#C3814C;stroke:#E6B48A;stroke-width:2}.m-bronze .mface{fill:#F8E6D6}
.m-none .mrim{fill:var(--surface-2);stroke:var(--line);stroke-width:2}.m-none .mface{fill:var(--surface)}.m-none .mrib1,.m-none .mrib2{fill:var(--line)}.m-none .mimg{opacity:.45;filter:grayscale(1)}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mgrid.small{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.mcard{position:relative;display:grid;justify-items:center;text-align:center;gap:4px;padding:16px 12px 14px;border-radius:18px;background:linear-gradient(170deg,var(--zt),var(--surface) 60%);border:1px solid var(--line);box-shadow:var(--shadow);text-decoration:none;color:var(--ink)}
.mcard b{font-size:15px}.mcard .mt{font-size:12.5px;font-weight:700;color:var(--warm-ink)}
.mcard small{font-size:12px;color:var(--ink-2);line-height:1.5}
.mcard em{position:absolute;top:8px;right:10px;font-style:normal;font-size:11px;color:var(--ink-2);font-family:var(--f-data)}
.mcard.lock{background:var(--surface)}
.mgot{display:grid;justify-items:center;text-align:center;gap:6px;padding:22px 18px}
.mgot small{font-size:12.5px;font-weight:700;letter-spacing:.08em;color:var(--warm-ink)}
.mgot h2{font-size:24px}.mgot p{margin:0;color:var(--ink-2)}
@media (prefers-reduced-motion:no-preference){.mgot .medal{animation:popin .5s cubic-bezier(.2,1.4,.4,1) both}}
.tmed{grid-column:1/-1;justify-self:start;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink-2);font-size:13px;border:1px solid var(--tint-line);border-radius:999px;padding:2px 12px 2px 4px;background:var(--surface)}
.tmed b{color:var(--warm-ink);font-family:var(--f-data)}
/* 跳出視窗 */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(12,24,32,.42);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:grid;place-items:end center;padding:12px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.sheet{place-items:center}}
.mdlcard{background:var(--surface);border-radius:22px;width:100%;max-width:640px;max-height:calc(100% - 20px);overflow:auto;box-shadow:0 24px 60px -20px rgba(0,0,0,.45);overscroll-behavior:contain}
@media (prefers-reduced-motion:no-preference){.sheet:not([hidden]) .mdlcard{animation:popin .22s ease}}
.shd{position:sticky;top:0;z-index:1;display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:18px 20px 12px;background:linear-gradient(180deg,var(--zt2),var(--surface))}
.shd small{font-size:12.5px;font-weight:700;color:var(--zi);letter-spacing:.06em}.shd h2{font-size:21px}
.sclose{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.dztabs{display:flex;gap:6px;overflow-x:auto;padding:0 20px 10px;scrollbar-width:thin}
.dztabs button{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-weight:700;font-size:13.5px;white-space:nowrap;color:var(--ink)}
.dztabs button[aria-selected="true"]{background:var(--zz);border-color:var(--zz);color:#fff}
.sbody{padding:6px 20px 22px;display:grid;gap:16px}
.sbody h3{display:flex;align-items:center;gap:8px;font-size:15.5px;margin:0 0 6px}
.sbody h3 i{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-style:normal;font-size:14px;background:var(--zt2);color:var(--zi)}
.sbody ul,.sbody ol{margin:0;padding-left:22px;display:grid;gap:4px;font-size:14.5px;line-height:1.65}
.dglist{display:grid;gap:8px}
.drug1{display:grid;gap:2px;border:1px solid var(--line);border-left:4px solid var(--zz);border-radius:12px;padding:8px 12px;background:var(--surface)}
.drug1 b{font-size:14.5px}.drug1 span{font-size:14px;line-height:1.6}.drug1 small{font-size:12.5px;color:var(--warm-ink)}
/* 人型疾病圖 */
:root{--fig1:#EAF1F6;--fig2:#DCE7EF;--figline:#BFCFDC}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--fig1:#26353F;--fig2:#1F2C36;--figline:#3C5162}}
:root[data-theme="dark"]{--fig1:#26353F;--fig2:#1F2C36;--figline:#3C5162}
.bmhead{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;align-items:baseline;margin-bottom:10px}
.bmwrap{display:grid;gap:16px}
@media (min-width:760px){.bmwrap{grid-template-columns:minmax(260px,360px) minmax(0,1fr);align-items:start}}
.bmfig{position:relative;width:100%;max-width:330px;margin:0 auto;aspect-ratio:240/440;background:radial-gradient(circle at 50% 40%,var(--zt),transparent 70%);border-radius:24px}
.bmfig.child{aspect-ratio:240/400}
.bmfig>svg{position:absolute;inset:0;width:100%;height:100%}
.figorg path{fill:color-mix(in srgb,var(--zz) 16%,transparent);stroke:none}
.figorg .figheart{fill:color-mix(in srgb,var(--lv1) 32%,transparent)}
.figeye{fill:var(--ink-2)}.figcheek{fill:color-mix(in srgb,#F28B8B 40%,transparent)}
.bpt{position:absolute;transform:translate(-50%,-50%);border:0;background:none;padding:0;display:grid;justify-items:center;gap:3px;cursor:pointer;z-index:1}
.bpt i{width:20px;height:20px;border-radius:50%;background:var(--zz);border:3px solid var(--surface);box-shadow:0 0 0 4px color-mix(in srgb,var(--zz) 25%,transparent)}
@media (prefers-reduced-motion:no-preference){.bpt i{animation:bpulse 2.4s ease-in-out infinite}}
@keyframes bpulse{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--zz) 8%,transparent)}}
.bpt span{font-size:12px;font-weight:700;background:var(--surface);border:1px solid var(--zb);border-radius:999px;padding:1px 8px;white-space:nowrap;color:var(--ink);box-shadow:0 2px 6px rgba(16,40,64,.1)}
.bpt small{position:absolute;left:calc(50% + 8px);top:-9px;min-width:17px;height:17px;padding:0 4px;border-radius:9px;background:var(--warm);color:#fff;font-size:10.5px;font-weight:700;display:grid;place-items:center}
.bpt:hover span,.bpt.on span{background:var(--zz);color:#fff;border-color:var(--zz)}
.bmlist{display:grid;gap:8px;align-content:start}
.bmrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 14px;color:var(--ink)}
.bmrow b{font-size:15px}.bmrow span{grid-column:1;font-size:13px;color:var(--ink-2);line-height:1.55}
.bmrow i{grid-column:2;grid-row:1 / 3;align-self:center;font-style:normal;color:var(--ink-2);font-size:18px}
.bmrow:hover{border-color:var(--zb);background:var(--zt)}
.patho{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.pcard{border:1px solid var(--line);border-radius:16px;padding:14px 16px;display:grid;gap:8px;align-content:start;background:linear-gradient(160deg,var(--zt),var(--surface) 55%);min-width:0}
.pcard>b{font-size:15.5px}.pcard p{margin:0;font-size:14px;line-height:1.7}
.pf{font-family:var(--f-data);font-weight:600;font-size:13.5px;background:var(--surface);border:1px dashed var(--zb);border-radius:10px;padding:5px 10px;color:var(--zi);justify-self:start}
.phow>span{font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.06em}
.phow ul{margin:4px 0 0;padding-left:18px;font-size:13.5px;line-height:1.65}
.qalist{display:grid;gap:8px}
.qa{border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.qa summary{cursor:pointer;padding:10px 14px;display:flex;gap:10px;align-items:flex-start;font-size:14.5px;list-style:none}
.qa summary::-webkit-details-marker{display:none}
.qn{font-family:var(--f-data);font-weight:600;color:var(--zi);flex:none}
.qa>div{padding:0 14px 12px 48px}.qa b{color:var(--ok)}.qa p{margin:4px 0 0;font-size:13.5px;color:var(--ink-2)}
/* 治療區、留觀區：疾病照護與輕重緩急 */
.dlist{display:grid;gap:8px}
@media (min-width:900px){.dlist{grid-template-columns:repeat(2,minmax(0,1fr))}}
.drow{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;align-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:var(--surface);transition:border-color .2s,transform .2s}
.drow:hover{transform:translateY(-1px);border-color:color-mix(in oklab,var(--brand) 35%,var(--line))}
.drow img{width:40px;height:40px}
.drow b{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:15.5px}
.drow span{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.drow small{display:block;font-size:12.5px;color:var(--bad);margin-top:2px}
.drow>i,.jrow>i{font-style:normal;color:var(--ink-2);font-size:18px}
.okmark{font-style:normal;font-size:11px;font-weight:700;border-radius:999px;padding:0 8px;background:color-mix(in srgb,var(--ok) 14%,var(--surface));color:var(--ok)}
.jlist{display:grid;gap:8px}
.jrow{display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:12px;align-items:center;text-decoration:none;color:var(--ink);border:1px solid var(--zb);border-radius:14px;padding:12px 14px;background:linear-gradient(100deg,var(--zt),var(--surface) 70%)}
.jn{width:32px;height:32px;border-radius:10px;background:var(--zz);color:#fff;display:grid;place-items:center;font-weight:900;font-family:var(--f-data)}
.jrow b{font-size:15.5px}.jrow>div>span{display:block;font-size:13.5px;color:var(--ink-2);line-height:1.55}
.jrow .jn{color:#fff;font-size:15px}
.cues{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.cues li{padding:8px 12px 8px 30px;border-radius:10px;background:var(--surface-2);font-size:14px;line-height:1.6;position:relative}
.cues li::before{content:"";position:absolute;left:12px;top:15px;width:8px;height:8px;border-radius:50%;background:var(--warm)}
.exans{border:1px dashed var(--tint-line);background:var(--tint);border-radius:12px;padding:10px 14px}
.exans summary{cursor:pointer;font-weight:700;color:var(--warm-ink)}
.exans p{margin:8px 0 0;line-height:1.75}
/* 線上教材 */
.courses{display:grid;gap:10px}
.course{--cz:var(--z-leader);display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:14px;align-items:center;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:var(--shadow)}
.course .cno{width:38px;height:38px;border-radius:12px;background:var(--cz);color:#fff;display:grid;place-items:center;font-weight:900;font-family:var(--f-data)}
.course b{display:block;font-size:16px}.course span{display:block;font-size:13px;color:var(--ink-2)}
.cbar{height:6px;border-radius:999px;background:var(--surface-2);margin:8px 0 3px;overflow:hidden;max-width:320px}
.cbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,var(--cz),var(--warm))}
.course small{font-size:12px;color:var(--ink-2)}.course .pend{color:var(--warm-ink)}
.cgo2{font-style:normal;font-size:20px;color:var(--ink-2)}.course.done .cgo2{color:var(--ok);font-weight:900}
.cwhead{display:grid;gap:10px}.cwtop{display:grid;gap:2px}.cwtop b{font-size:18px}
.cwdots{display:flex;gap:6px;flex-wrap:wrap}
.cwdots a{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;text-decoration:none;font-family:var(--f-data);font-size:12.5px;font-weight:600;border:1.5px solid var(--line);color:var(--ink-2);background:var(--surface)}
.cwdots a.read{background:color-mix(in oklab,var(--z-leader) 14%,var(--surface));border-color:color-mix(in oklab,var(--z-leader) 40%,var(--line));color:color-mix(in oklab,var(--z-leader) var(--ti),var(--ink))}
.cwdots a[aria-selected="true"]{background:var(--z-leader);border-color:var(--z-leader);color:#fff}
.cwgrid{display:grid;gap:16px}
.cwtoc{display:none}
@media (min-width:960px){.cwgrid{grid-template-columns:230px minmax(0,1fr);align-items:start}
  .cwtoc{display:grid;gap:4px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
  .cwtoc a{display:grid;grid-template-columns:24px minmax(0,1fr);gap:8px;align-items:start;text-decoration:none;color:var(--ink-2);font-size:13.5px;padding:6px 8px;border-radius:10px;line-height:1.5}
  .cwtoc i{font-style:normal;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:11px;background:var(--surface-2);font-family:var(--f-data)}
  .cwtoc a.read i{background:color-mix(in oklab,var(--z-leader) 16%,var(--surface));color:color-mix(in oklab,var(--z-leader) var(--ti),var(--ink))}
  .cwtoc a[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:0 0 0 1px var(--line)}
  .cwtoc a[aria-current="true"] i{background:var(--z-leader);color:#fff}}
.lckind{display:flex;gap:8px;align-items:center}.lckind span,.lckind1{background:var(--kc);color:#fff;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:800;white-space:nowrap}.lckind small{color:var(--ink-2);font-size:12px}
.lcchk{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px}.lcchk label{display:flex;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);cursor:pointer}.lcchk label:has(input:checked){border-color:var(--z-leader);background:color-mix(in srgb,var(--z-leader) 10%,var(--surface))}.lcchk input{width:18px;height:18px;accent-color:var(--z-leader)}
.lcthink,.lcmcq,.lcbr,.lcord,.lcbuild,.lcrev{display:grid;gap:10px}
.lcflip{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.fcard{position:relative;min-height:150px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface-2);padding:14px;text-align:left;font:inherit;color:var(--ink);cursor:pointer;display:grid}
.fcard .lff,.fcard .lfb{grid-area:1/1;display:grid;gap:6px;align-content:center;transition:opacity .25s,transform .35s}.fcard .lff b{font-size:15.5px;line-height:1.5}.fcard .lff small{color:var(--z-leader);font-weight:700}
.fcard .lfb{opacity:0;transform:rotateY(90deg);font-size:14px;line-height:1.7}
.fcard[aria-pressed=true]{background:color-mix(in srgb,var(--z-leader) 9%,var(--surface));border-color:var(--z-leader)}.fcard[aria-pressed=true] .lff{opacity:0;transform:rotateY(90deg)}.fcard[aria-pressed=true] .lfb{opacity:1;transform:none}
.ordpool{display:flex;flex-wrap:wrap;gap:8px}.ordpool .chip{border:1.5px solid var(--z-leader);background:var(--surface);color:var(--ink);border-radius:12px;padding:8px 12px;font:inherit;font-size:14px;text-align:left;cursor:pointer}.ordpool .chip:disabled{opacity:.3}
.ordans{margin:0;padding-left:22px;display:grid;gap:6px}.ordans li{padding:6px 10px;border-radius:10px;background:var(--surface-2)}.ordans li.ok{background:color-mix(in srgb,var(--ok) 14%,var(--surface))}.ordans li.bad{background:color-mix(in srgb,var(--bad) 12%,var(--surface))}
.lcbuild label{display:grid;gap:4px}.lcbuild textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;font-size:14.5px;background:var(--surface);color:var(--ink);resize:vertical}
.lctimer{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;border:2px dashed var(--z-leader);border-radius:14px;padding:12px 14px}.lctimer>div:first-child{display:grid;gap:2px}.lctimer .tnum{font-family:var(--f-data);font-size:34px;color:var(--z-leader)}.lctimer.end{background:color-mix(in srgb,var(--bad) 12%,var(--surface));border-color:var(--bad)}.lctimer.end .tnum{color:var(--bad)}
.cwrap{display:grid;gap:4px}.cplan{justify-self:end;font-size:12.5px;color:var(--z-leader);font-weight:700;text-decoration:none;padding:0 6px}
.lcmix{display:flex;border-radius:10px;overflow:hidden;font-size:12px;font-weight:800;color:#fff}.lcmix span{background:var(--kc);padding:6px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lcplan td:nth-child(3){min-width:8.5em}.lcplan td:first-child{white-space:nowrap;font-family:var(--f-data)}.lcplan td:last-child{font-size:13px;color:var(--ink-2)}
.lch{display:flex;align-items:center;gap:10px}.lcic{flex:none;width:40px;height:40px;border-radius:12px;background:color-mix(in srgb,var(--z-leader) 12%,var(--surface));display:grid;place-items:center}.lcic img{width:32px;height:32px}
.cc.cci{grid-template-columns:44px minmax(0,1fr);column-gap:10px}.cc.cci .ccimg{grid-row:span 2;width:44px;height:44px}.cc.cci .ccimg img{width:44px;height:44px}
.lfig{margin:4px 0;background:var(--surface-2);border-radius:14px;padding:10px 10px 6px;display:grid;gap:4px}.lfig svg{width:100%;height:auto;max-height:340px;fill:var(--ink);display:block}.lfig figcaption{font-size:12.5px;color:var(--ink-2);text-align:center}
.lft{font-size:16px;font-family:inherit}@media (max-width:600px){.lft{font-size:24px}.lfs{font-size:19px}.lft.lfp{font-size:15px}}.lfbo{font-weight:800}.lfs{font-size:13px;fill:var(--ink-2)}.lfw{fill:#fff;font-weight:800}
.lfzone{fill:var(--surface);stroke:var(--line);stroke-width:2}.lfbed{fill:color-mix(in srgb,var(--z-leader) 14%,var(--surface));stroke:var(--line)}

/* 心律：key → [名稱, 預設有無脈搏, 預設心跳] （名稱只給教師看，學員要自己判讀） */
const RHY = {
  sinus: ["竇性心律", true, 82], stach: ["竇性心搏過速", true, 128], brady: ["竇性心搏過慢", true, 38],

  avb3: ["三度房室傳導阻滯", true, 34], svt: ["陣發性上心室心搏過速（SVT）", true, 186], af: ["心房顫動（AF，快速心室反應）", true, 148],
  vt: ["心室頻脈（有脈搏）", true, 172], pvt: ["無脈性心室頻脈（pVT）", false, 176], vf: ["心室顫動（VF）", false, 0],

  none: ["尚未設定心律", false, 0]
};
const RHY_GROUPS = [["無脈搏", ["vf", "pvt", "tdp", "asys", "pea", "sine"]], ["心搏過慢", ["brady", "avb1", "avb2a", "avb2b", "avb3", "paced"]], ["其他有脈搏", ["sinus", "stach", "svt", "af", "vt"]], ["高血鉀（可配合脈搏開關）", ["peakT", "hk2", "sine"]]];

const RHY_CALL = ["vf", "vt", "tdp", "asys", "pea", "sinus", "stach", "brady", "avb1", "avb2a", "avb2b", "avb3", "svt", "af", "peakT", "hk2", "sine", "paced"];

const CALL_NAME = r => r === "vt" || r === "pvt" ? "心室頻脈（VT）" : RHY[r][0];
const sameCall = (a, b) => a === b || (["vt", "pvt"].includes(a) && ["vt", "pvt"].includes(b));
const shockable = r => r === "vf" || r === "pvt" || r === "tdp";

const CASES = [

/* 建議回覆：病例線索 → 兩側共用線索 → 動態（插管太深）→ 一般 */
function suggest(S, k){
  if (S.custom && S.custom[k]) return S.custom[k];
  const c = CASE_BY[S.caseId], cl = (c && c.clue) || {};
  const ett = S.airway && S.airway.ett;
  if (ett && ett.depth >= 24 && (k === "lung_L" || k === "lung")) return k === "lung" ? "右側呼吸音正常，左側明顯變小。" : "左側呼吸音明顯變小。";
  if (ett && ett.depth >= 24 && k === "lung_R") return cl.lung_R || "右側呼吸音正常。";
  if (ett && ett.depth <= 19 && (k === "lung" || k === "lung_R" || k === "lung_L")) return "兩側呼吸音很小，脖子附近聽到漏氣聲。";
  if (cl[k]) return cl[k];
  if (/^pulse_/.test(k)) return pulseText(S, k);
  /* 有脈搏、沒在通氣時，呼吸與心音的一般答案跟著狀態走 */
  if (S.pulse && S.rhythm !== "none" && !S.custom[k]) { const v = curVit(S, Date.now()), fast = (+v.rr || 0) >= 28, bag = S.airway && S.airway.dev;
    if (k === "lung") return bag ? "通氣時兩側呼吸音對稱。" : fast ? "呼吸很喘，兩側呼吸音對稱。" : "兩側呼吸音對稱、清楚。";
    if (k === "lung_R" || k === "lung_L") return `${k === "lung_R" ? "右" : "左"}側呼吸音清楚。`;
    if (k === "chest") return bag ? "通氣時兩側起伏對稱。" : `自己有呼吸，約 ${v.rr || "—"} 下／分，兩側起伏對稱。`;
    if (k === "heart") return `聽得到心音，${["af", "avb2a", "avb2b"].includes(S.rhythm) ? "不規則" : "規則"}，約 ${v.hr || RHY[S.rhythm][2]} 下／分。`; }
  const base = k.replace(/_[RL]$/, "");
  if (base !== k && cl[base]) return cl[base];
  return ASK_BY[k] ? ASK_BY[k][2] : "";
}

/* 摸脈搏：依有無脈搏、血壓、心律自動產生答案（教師可以改） */
function pulseText(S, k){
  const site = { pulse_car: "頸動脈", pulse_fem: "股動脈", pulse_rad: "橈動脈" }[k];
  if (S.cpr) return `壓胸中摸到的是壓胸造成的脈動；請先暫停壓胸，10 秒內摸${site}。`;
  if (!S.pulse) return `摸不到${site}脈搏（摸了 10 秒）。`;
  const v = curVit(S, Date.now()), sbp = +v.sbp || 0, hr = +v.hr || RHY[S.rhythm][2];
  const rate = `約 ${hr} 下／分${["af", "avb2a", "avb2b"].includes(S.rhythm) ? "、不規則" : ""}`;
  if (k === "pulse_rad") return sbp < 80 ? `摸不到${site}脈搏（周邊灌流差）。` : sbp < 90 ? `${site}很微弱，${rate}。` : `${site}摸得到，${rate}。`;
  if (k === "pulse_fem") return sbp < 60 ? `${site}很微弱，${rate}。` : sbp < 90 ? `${site}微弱，${rate}。` : `${site}清楚，${rate}。`;
  return sbp < 60 ? `${site}很微弱，${rate}。` : sbp < 90 ? `${site}微弱但摸得到，${rate}。` : `${site}清楚有力，${rate}。`;
}

/* 教師錄音回覆（8 秒內） */
let REC = null;
async function record(id, ui, re){
  if (REC && REC.id === id) { REC.mr.stop(); return; }
  if (!navigator.mediaDevices || !window.MediaRecorder) return toast("這支手機不支援錄音，請用打字回覆", true);
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mime = ["audio/webm;codecs=opus", "audio/mp4", "audio/webm"].find(m => MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || "";
    const mr = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 24000 } : undefined), chunks = [];
    REC = { id, mr }; ui.rec = id; re();
    mr.ondataavailable = ev => chunks.push(ev.data);
    mr.onstop = async () => { stream.getTracks().forEach(t => t.stop()); clearTimeout(REC && REC.to); REC = null; ui.rec = ""; re();
      const blob = new Blob(chunks, { type: mr.mimeType || "audio/webm" }); const b64 = await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(String(fr.result).split(",")[1]); fr.readAsDataURL(blob); });
      const up = await api("simVoice", { code: ST.code, key: ST.seat.key, data: b64, mime: (mr.mimeType || "audio/webm").split(";")[0] });
      if (!up || !up.ok) return toast((up && up.error) || "語音上傳失敗", true);
      const x = ($("rp-" + id) && $("rp-" + id).value.trim()) || "";
      await act({ type: "reply", id, x, voice: up.id }); toast("語音已送出"); };
    mr.start(); REC.to = setTimeout(() => mr.state === "recording" && mr.stop(), 8000); toast("錄音中，最多 8 秒，再按一次停止");
  } catch (err) { toast("沒有麥克風權限，請用打字回覆", true); }
}

    <p class="hint">參考：辨識後 10 秒內開始壓胸、每 2 分鐘換手、中斷 < 10 秒、Epinephrine 每 3–5 分鐘、VF／pVT 儘早非同步電擊。講評請由臨床教師帶領。</p></section>`;

function csv(S){
  if (!S) return; const q = v => `"${String(v == null ? "" : v).replace(/"/g, '""')}"`;

}
